name: Build & Test

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:

  build-native:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Build Tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle.kts') }}

      - name: Build Native
        run: pod repo update --verbose && ./gradlew :mmkv-kotlin:iosArm64Binaries :mmkv-kotlin:iosSimulatorArm64Binaries :mmkv-kotlin:macosArm64Binaries

      - name: Run Native Tests
        run: ./gradlew :mmkv-kotlin-test:cleanMacosArm64Test && ./gradlew :mmkv-kotlin-test:macosArm64Test --stacktrace

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Native-Test-Reports
          path: mmkv-kotlin-test/build/reports
        if: failure()

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Build Tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle.kts') }}

      - name: Build Android
        run: ./gradlew :mmkv-kotlin:assembleAndroidMain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle Managed Device Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/gradle-managed
            ${{ env.ANDROID_HOME }}/system-images/android-37.0/google_apis_ps16k/x86_64
          key: gmd-pixel10Api37-google-ps16k-x86_64

      - name: Accept SDK Licenses and Install System Image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-37.0;google_apis_ps16k;x86_64"

      - name: Run Android 17 Instrumented Tests
        run: >
          ./gradlew :mmkv-kotlin-test:pixel10Api37AndroidDeviceTest --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Android-Test-Reports
          path: |
            mmkv-kotlin-test/build/reports
            mmkv-kotlin-test/build/outputs/androidTest-results
        if: failure()
